apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ubys-core-web-app
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: dev
                  namespace: ubys-dev
                  autoSync: true
                  selfHeal: true
                  prune: true
                  wave: "1"
                  maxHistory: "5"

                - env: test
                  namespace: ubys-test
                  autoSync: true
                  selfHeal: true
                  prune: false
                  wave: "2"
                  maxHistory: "5"

                - env: staging
                  namespace: ubys-staging
                  autoSync: false
                  selfHeal: false
                  prune: false
                  wave: "3"
                  maxHistory: "10"

                - env: prod
                  namespace: ubys-prod
                  autoSync: false
                  selfHeal: false
                  prune: false
                  wave: "4"
                  maxHistory: "20"

          - git:
              repoURL: https://github.com/yasinsunmaz/ubys-core-deployments.git
              revision: HEAD
              directories:
                - path: apps/ubys-core-web-app/overlays/*

  template:
    metadata:
      name: "ubys-core-web-app-{{env}}"
      labels:
        app: ubys-core-web-app
        env: {{env}}
      annotations:
        argocd.argoproj.io/sync-wave: {{wave}}
        notifications.argoproj.io/subscribe.on-sync-failed.slack: deploy-alerts
        notifications.argoproj.io/subscribe.on-health-degraded.slack: deploy-alerts
    spec:
      project: "default"
      source:
        repoURL: https://github.com/yasinsunmaz/ubys-core-deployments.git
        targetRevision: HEAD
        path: "apps/ubys-core-web-app/overlays/{{env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: {{namespace}}
      syncPolicy:
        automated:
          selfHeal: {{selfHeal}}
          prune: {{prune}}
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 3
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 3m
      revisionHistoryLimit: {{maxHistory}}
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
