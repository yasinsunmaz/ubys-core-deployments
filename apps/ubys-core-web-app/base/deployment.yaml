apiVersion: apps/v1
kind: Deployment
metadata:
  name: ubys-core-web-app
  labels:
    app: ubys-core-web-app
spec:
  selector:
    matchLabels:
      app: ubys-core-web-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ubys-core-web-app
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ubys-core-web-app
          image: harbor.ikc.edu.tr/ubys-core-web-app/ubys-core-web-app:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: ubys-core-web-app-config
                  key: NODE_ENV
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ubys-core-web-app-config
                  key: API_BASE_URL
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ubys-core-web-app-secret
                  key: APP_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      imagePullSecrets:
        - name: harbor-registry-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - ubys-core-web-app
                topologyKey: kubernetes.io/hostname
