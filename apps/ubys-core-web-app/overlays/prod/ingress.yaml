apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ubys-core-web-app
  namespace: ubys-core-web-app-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - prod.ubys.com
      secretName: ubys-core-web-app-prod-tls
  rules:
    - host: prod.ubys.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ubys-core-web-app
                port:
                  number: 80
