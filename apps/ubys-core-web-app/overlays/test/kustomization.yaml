apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ubys-test

bases:
  - ../../base

# CI pipeline bu satırı günceller: bump-image.sh
images:
  - name: harbor.ikc.edu.tr/ubys-core-web-app/ubys-core-web-app:1.0.1
    newTag: "1.0.1"

configMapGenerator:
  - name: ubys-core-web-app-config
    behavior: merge
    literals:
      - NODE_ENV=test
      - API_BASE_URL=http://ubys-core-web-app.ubys-test.svc.cluster.local
      - LOG_LEVEL=info

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ubys-core-web-app
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: ubys-core-web-app

resources:
  - ingress.yaml

commonLabels:
  env: test
