apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ubys-core-web-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: nginx
  rules:
    - host: ubys-core-web-app.dev.ubys.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ubys-core-web-app
                port:
                  number: 80
