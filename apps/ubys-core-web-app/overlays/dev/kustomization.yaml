apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ubys-dev

# CI pipeline bu satırı günceller: bump-image.sh
images:
  - name: harbor.ikc.edu.tr/ubys-core-web-app/ubys-core-web-app
    newTag: "1.0.0"

configMapGenerator:
  - name: ubys-core-web-app-config
    behavior: merge
    literals:
      - NODE_ENV=dev
      - API_BASE_URL=http://ubys-core-web-app.ubys-dev.svc.cluster.local
      - LOG_LEVEL=debug

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ubys-core-web-app
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: ubys-core-web-app

resources:
  - ../../base  
  - ingress.yaml

commonLabels:
  env: dev
