apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ubys-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://github.com/yasinsunmaz/ubys-core-deployments.git
      targetRevision: HEAD
      path: projects
    - repoURL: https://github.com/yasinsunmaz/ubys-core-deployments.git
      targetRevision: HEAD
      path: appsets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
