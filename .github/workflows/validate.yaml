name: Validate Manifests

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "appsets/**"
      - "projects/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Setup kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Validate overlays
        run: |
          FAILED=0
          for overlay in apps/*/overlays/*/; do
            echo "Kontrol: $overlay"
            if ! kustomize build "$overlay" | kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.28.0; then
              echo "HATA: $overlay"
              FAILED=1
            fi
          done
          [ $FAILED -eq 0 ] || exit 1

      - name: Prod semver kontrolu
        run: |
          for f in apps/*/overlays/prod/kustomization.yaml; do
            TAG=$(grep "newTag:" "$f" | awk '{print $2}' | tr -d '"')
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "HATA: $f semver degil: $TAG"; exit 1; }
          done
          echo "Tum prod tagler semver."
